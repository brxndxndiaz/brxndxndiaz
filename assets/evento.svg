<text x="48" y="100" class="s" fill="#f5f5f2" font-size="32" font-weight="720">Ticketing from discovery to the door.</text>
<text x="48" y="129" class="s" fill="#8e9197" font-size="15">One product across customers, organizers, admission and operations.</text>
