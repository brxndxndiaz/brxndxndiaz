    <g transform="translate(310)"><rect width="196" height="144" rx="14" fill="#f2f2ef"/><text x="20" y="35" fill="#6d7075" font-size="10" letter-spacing="1.4">02 / CORE</text><text x="20" y="70" fill="#17181a" font-size="17" font-weight="700">EVENTO API</text><text x="20" y="99" fill="#595c61" font-size="11">events · orders</text><text x="20" y="119" fill="#595c61" font-size="11">payments · tickets</text></g>
    <g transform="translate(620)"><rect width="196" height="144" rx="14" fill="#222428" stroke="#fff" stroke-opacity=".12"/><text x="20" y="35" fill="#777a81" font-size="10" letter-spacing="1.4">03 / OPERATE</text><text x="20" y="70" fill="#f2f2ef" font-size="17">ORGANIZERS</text><text x="20" y="99" fill="#999ca2" font-size="11">manage · staff</text><text x="20" y="119" fill="#999ca2" font-size="11">reporting · content</text></g>
